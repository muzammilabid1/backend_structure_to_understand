version: 0.2

env:
    variables:
        AWS_DEFAULT_REGION: eu-west-2

phases:
    build:
        commands:
            - echo "Staging DB reset started $(date -u)"
            - bash ./release/reset_staging_pre.sh
            - bash ./release/stage/clone_prod_db.sh
            - bash ./release/stage/restart_notification.sh
            - aws s3 sync s3://lwp-public-media s3://lwp-public-media-stage --only-show-errors
            - aws s3 sync s3://lwp-user-media s3://lwp-user-media-stage --only-show-errors
            - echo "Staging DB reset finished $(date -u)"
