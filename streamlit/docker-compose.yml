version: '3.8'

services:
    app:
        build:
            context: ./app-streamlit
        environment:
            - OPENAI_API_KEY

    tunnel:
        image: cloudflare/cloudflared
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
            - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}

networks:
    default:
        name: app
