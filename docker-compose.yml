services:
    apps:
        build: 'docker/apps'
        env_file: '.env'
        volumes:
            - '.:/var/www/platform'
        ports:
            - '3000:3000'
            - '3006:3006'
        networks:
            - 'default'

    postgres_db:
        build: 'docker/postgres_db'
        environment:
            POSTGRES_DB: 'postgres'
            POSTGRES_USER: 'postgres'
            POSTGRES_PASSWORD: 'docker'
        ports:
            - '5432:5432'
        networks:
            - 'default'

    minio:
        image: 'pgsty/minio:RELEASE.2026-08-04T00-00-00Z'
        command: 'server /data'
        volumes:
            - './seed-data/minio-base:/data'
        environment:
            MINIO_ROOT_USER: 'key123'
            MINIO_ROOT_PASSWORD: 'secret123'
            MINIO_BROWSER: 'off'
        ports:
            - '9000:9000'
        networks:
            - 'default'
        healthcheck:
            test: curl -f http://minio:9000/minio/health/live || exit 1
            interval: 1s
            timeout: 5s
            retries: 10

    minio_buckets:
        image: 'pgsty/mc:RELEASE.2026-09-16T00-00-00Z'
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            /usr/bin/mc config host add local http://minio:9000 key123 secret123;
            /usr/bin/mc mb local/public --ignore-existing;
            /usr/bin/mc mb local/usermedia --ignore-existing;
            /usr/bin/mc anonymous set download local/public;
            "
        networks:
            - 'default'

networks:
    default:
        driver: 'bridge'
