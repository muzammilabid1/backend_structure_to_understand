name: Smoke/Sanity tests on PR → dev

on:
    pull_request:
        branches:
            - dev
        types:
            - opened
            - reopened
            - ready_for_review

jobs:
    smoke-pr:
        if: github.event.pull_request.draft == false
        uses: ./.github/workflows/playwright-smoke-base.yml
        with:
            branch: ${{ github.event.pull_request.head.ref }}
            testCommand: yarn test:playwright:smoke
            type: Smoke
        secrets:
            GH_LWP_PULL_TOKEN: ${{ secrets.GH_LWP_PULL_TOKEN }}
            slack_webhook: ${{ secrets.slack_webhook }}
            WONDE_API_TOKEN: ${{ secrets.WONDE_API_TOKEN }}
