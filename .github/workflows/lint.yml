name: Lint source code

on:
    - push

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  token: ${{ secrets.GH_LWP_PULL_TOKEN }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.23.4
                  cache: yarn
            - run: yarn install
            - run: yarn lint
