name: Nightly staging tests

on:
    # [LWP-9063] Cypress nightly tests are disabled due to excessive run times.
    # Re-enable the schedule below once performance issues are resolved.
    # schedule:
    #     - cron: '45 2 * * *'
    workflow_dispatch:

jobs:
    run-nightly:
        uses: ./.github/workflows/nightly-base.yml
        with:
            branch: staging
        secrets:
            GH_LWP_PULL_TOKEN: ${{ secrets.GH_LWP_PULL_TOKEN }}
            slack_webhook: ${{ secrets.slack_webhook }}
            WONDE_API_TOKEN: ${{ secrets.WONDE_API_TOKEN }}
