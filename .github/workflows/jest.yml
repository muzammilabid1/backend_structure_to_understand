name: Jest tests

on:
    - push

jobs:
    jest:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  token: ${{ secrets.GH_LWP_PULL_TOKEN }}
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.23.4
                  cache: yarn
            - run: yarn install && yarn workspace graphql-provider references:build
            - run: yarn test:jest
            - run: yarn test:vitest
