name = "monday-hubspot-sync"
main = "index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id='3c92ada45d9ee1952454f9a828a1c782'

[triggers]
crons = ["0 */6 * * *"]

[observability]
enabled = true

[vars]
MONDAY_API_URL = "https://api.monday.com/v2"

# Only dev for dev and local
[env.dev]
name = "monday-hubspot-sync-dev"

[env.dev.vars]
# Must repeat vars for dev environment
MONDAY_API_URL = "https://api.monday.com/v2"


[env.staging]
name = "monday-hubspot-sync-staging"

[env.staging.vars]
MONDAY_API_URL = "https://api.monday.com/v2"
READ_ONLY_MODE = "true"

# Secrets (set Secrets via: wrangler secret put <NAME>). Example:
# - MONDAY_API_KEY
# - HUBSPOT_ACCESS_TOKEN